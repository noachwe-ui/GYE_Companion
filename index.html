<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GYE Companion</title>
  <style>
    body { background-color: #121212; color: #ffffff; font-family: sans-serif; display: flex; justify-content: center; padding: 20px; margin: 0; }
    .card { background-color: #1e1e1e; padding: 24px; border-radius: 16px; max-width: 500px; width: 100%; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    .streak-badge { background: #2a2a2a; padding: 6px 14px; border-radius: 20px; display: inline-block; margin-bottom: 20px; font-weight: bold; color: #ff9800; }
    .quote-text { font-size: 1.2rem; line-height: 1.5; margin-bottom: 10px; }
    .quote-source { color: #a0a0a0; font-size: 0.95rem; margin-bottom: 20px; }
    .actions { display: flex; flex-direction: column; gap: 12px; }
    .btn { padding: 12px 16px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1rem; background-color: #0288d1; color: white; text-decoration: none; }
    .btn-forum { background-color: #2e7d32; }
    .btn-secondary { background-color: #333; color: #e0e0e0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="streak-badge">🔥 Streak: Day 1</div>
    <p class="quote-text" id="quote">Loading quote...</p>
    <p class="quote-source" id="source"></p>
    <div class="actions">
      <button class="btn" id="reload-btn">New Quote</button>
      <a class="btn btn-forum" href="https://guardyoureyes.com/forum" target="_blank" rel="noopener">Open GYE Forum</a>
      <a class="btn btn-secondary" href="https://guardyoureyes.com" target="_blank" rel="noopener">Visit GYE Main Site</a>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
