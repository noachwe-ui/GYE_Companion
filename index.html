<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GYE Companion</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }
    .card {
      background-color: #1e1e1e;
      border-radius: 16px;
      padding: 24px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: #2a2a2a;
      color: #ff9800;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.9rem;
      margin-bottom: 16px;
    }
    .account-bar {
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid #2a2a2a;
    }
    .user-status {
      font-size: 0.85rem;
      color: #a0a0a0;
      margin-bottom: 8px;
    }
    .quote-box {
      min-height: 110px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      margin-bottom: 20px;
    }
    .quote-text {
      font-size: 1.2rem;
      font-weight: 500;
      line-height: 1.4;
      margin-bottom: 8px;
    }
    .quote-source {
      font-size: 0.9rem;
      color: #888888;
      font-style: italic;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:active {
      opacity: 0.8;
    }
    .btn-primary { background-color: #0088cc; color: white; }
    .btn-secondary { background-color: #2e7d32; color: white; }
    .btn-sos { background-color: #d32f2f; color: white; }
    .btn-outline { background-color: transparent; border: 1px solid #444; color: #ccc; }
  </style>
</head>
<body>

  <div class="card">
    <div id="streak-badge" class="badge">🔥 Streak: Day 0</div>

    <div class="account-bar">
      <div id="user-status" class="user-status">Not connected</div>
      <button class="btn btn-outline" id="auth-btn">Connect GYE Account</button>
    </div>

    <div class="quote-box">
      <div id="quote" class="quote-text">Loading...</div>
      <div id="source" class="quote-source"></div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="watch-clip-btn">Watch a Clip</button>
      <button class="btn btn-sos" id="sos-btn">🚨 GYE SOS / Hotline</button>
      <button class="btn btn-secondary" id="forum-btn">Open GYE Forum</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>

<div class="settings-section" style="margin-top: 15px;">
  <button id="accessibility-btn" class="btn btn-secondary" style="width: 100%;">
    Enable Accessibility Service
  </button>
</div>
