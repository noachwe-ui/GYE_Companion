<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GYE Companion</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #121212; color: #e0e0e0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: #1e1e1e; border: 1px solid #333; border-radius: 16px; padding: 24px; max-width: 400px; width: 100%; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5); }
    .streak-badge { display: inline-block; background-color: #2e7d32; color: #ffffff; font-size: 0.85rem; font-weight: 600; padding: 6px 12px; border-radius: 20px; margin-bottom: 16px; }
    .quote-text { font-size: 1.25rem; line-height: 1.5; font-weight: 500; margin-bottom: 12px; color: #ffffff; }
    .quote-source { font-size: 0.9rem; color: #a0a0a0; margin-bottom: 24px; font-style: italic; }
    .actions { display: flex; gap: 12px; }
    .btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; text-decoration: none; text-align: center; font-size: 0.95rem; }
    .btn-primary { background-color: #0288d1; color: white; }
    .btn-secondary { background-color: #333; color: #e0e0e0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="streak-badge">🔥 Streak: Day 1</div>
    <p class="quote-text" id="quote">Loading...</p>
    <p class="quote-source" id="source"></p>
    <div class="actions">
      <a href="#" id="shiur-btn" class="btn btn-primary" target="_blank">Watch Shiur</a>
      <button class="btn btn-secondary" onclick="window.close()">Dismiss</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
